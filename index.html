<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Hari's technical blog — AI, automation, and engineering.">
  <title>ylnhari · Blog</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="blog-index">
<div class="blog-index">

  <header>
    <h1>ylnhari's Blog</h1>
    <p>AI, automation, and engineering — written with a little help from machines.</p>
    <nav class="site-links" style="margin-top:10px;font-size:.9rem;">
      <a href="https://ylnhari.github.io/ai-signal/bench.html">Model Bench</a> &middot;
      <a href="posts/2026-07-13-open-source-vs-paid-frontier-llms/interactive.html">Interactive Frontier Plot</a> &middot;
      <a href="https://ylnhari.github.io/ai-signal/">AI Signal daily</a>
    </nav>
  </header>

  <main>
    <div class="post-filters" role="search">
      <label for="post-search">Search posts</label>
      <input id="post-search" type="search" autocomplete="off" placeholder="Title, topic, or tag">
      <label for="tag-filter">Filter by tag</label>
      <select id="tag-filter">
        <option value="">All tags</option>
      </select>
      <p id="post-count" class="filter-status" role="status" aria-live="polite">Loading posts…</p>
    </div>
    <ul class="post-list" id="post-list">
      <li class="empty-state">Loading posts…</li>
    </ul>
  </main>

</div>

<script>
  const list = document.getElementById('post-list');
  const search = document.getElementById('post-search');
  const tagFilter = document.getElementById('tag-filter');
  const count = document.getElementById('post-count');
  let posts = [];

  function postTags(post) {
    return Array.isArray(post.tags) ? post.tags.filter(tag => typeof tag === 'string') : [];
  }

  function render() {
    const query = search.value.trim().toLocaleLowerCase();
    const selectedTag = tagFilter.value;
    const matches = posts.filter(post => {
      const tags = postTags(post);
      const searchable = [post.title, post.description, ...tags]
        .filter(value => typeof value === 'string')
        .join(' ')
        .toLocaleLowerCase();
      return (!query || searchable.includes(query)) && (!selectedTag || tags.includes(selectedTag));
    });

    list.replaceChildren();
    if (!matches.length) {
      const empty = document.createElement('li');
      empty.className = 'empty-state';
      empty.textContent = posts.length ? 'No posts match these filters.' : 'No posts yet. Check back soon.';
      list.append(empty);
    }

    for (const post of matches) {
      const card = document.createElement('li');
      card.className = 'post-card';

      const heading = document.createElement('h2');
      const titleLink = document.createElement('a');
      titleLink.href = `posts/${encodeURIComponent(String(post.slug || ''))}/`;
      titleLink.textContent = String(post.title || 'Untitled post');
      heading.append(titleLink);
      card.append(heading);

      const meta = document.createElement('p');
      meta.className = 'meta';
      const parsedDate = new Date(`${post.date || ''}T00:00:00`);
      meta.textContent = Number.isNaN(parsedDate.getTime())
        ? ''
        : parsedDate.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
      if (typeof post.medium_url === 'string') {
        try {
          const mediumUrl = new URL(post.medium_url);
          if (mediumUrl.protocol === 'https:') {
            if (meta.textContent) meta.append(' · ');
            const mediumLink = document.createElement('a');
            mediumLink.href = mediumUrl.href;
            mediumLink.target = '_blank';
            mediumLink.rel = 'noopener';
            mediumLink.textContent = 'Read on Medium';
            meta.append(mediumLink);
          }
        } catch (_) {
          // Ignore invalid external links in the post catalog.
        }
      }
      card.append(meta);

      const description = document.createElement('p');
      description.className = 'description';
      description.textContent = String(post.description || '');
      card.append(description);

      const tags = postTags(post);
      if (tags.length) {
        const tagList = document.createElement('div');
        tagList.className = 'tags';
        for (const tag of tags) {
          const badge = document.createElement('span');
          badge.className = 'tag';
          badge.textContent = tag;
          tagList.append(badge);
        }
        card.append(tagList);
      }
      list.append(card);
    }

    count.textContent = `${matches.length} ${matches.length === 1 ? 'post' : 'posts'}`;
  }

  search.addEventListener('input', render);
  tagFilter.addEventListener('change', render);

  fetch('posts/index.json')
    .then(response => {
      if (!response.ok) throw new Error('Post catalog request failed');
      return response.json();
    })
    .then(data => {
      if (!Array.isArray(data)) throw new Error('Post catalog is invalid');
      posts = data.filter(post => post && typeof post === 'object');
      const tags = [...new Set(posts.flatMap(postTags))]
        .sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));
      for (const tag of tags) {
        const option = document.createElement('option');
        option.value = tag;
        option.textContent = tag;
        tagFilter.append(option);
      }
      render();
    })
    .catch(() => {
      list.replaceChildren();
      const error = document.createElement('li');
      error.className = 'empty-state';
      error.textContent = 'Could not load posts. Please try again later.';
      list.append(error);
      count.textContent = 'Posts are unavailable';
    });
</script>
</body>
</html>
